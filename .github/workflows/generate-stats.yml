name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *"  # daily
  workflow_dispatch: {}

concurrency:
  group: generate-stats
  cancel-in-progress: true

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate metrics infographic
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          user: mr-crypter
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large
          # Count org repos too, otherwise all C++ is invisible: it lives
          # entirely in 0xMidax/crypto-trader and 0xMidax/Phoenix-strategy.
          # dapplooker is ~70 repos that would swamp the result, so skip the
          # org and add back only loky-backend.
          repositories_affiliations: owner, organization_member
          repositories_skipped: |
            @use.patterns

            dapplooker/*
            +dapplooker/loky-backend
          committer_token: ${{ secrets.PROFILE_TOKEN }}
          committer_branch: main
          committer_message: "chore: refresh metrics infographic"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: jupyter notebook
          plugin_languages_colors: github
          # plugin_habits and plugin_achievements are disabled: both are broken
          # upstream in v3.34, not misconfigured. See the note in README history.
          #   habits       -> crashes on push events with no payload.commits
          #                   (branch/tag deletions), habits/index.mjs:51
          #   achievements -> its GraphQL query still asks for Projects (classic),
          #                   which GitHub sunset, so the API returns NOT_FOUND

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: mr-crypter
          outputs: |
            assets/snake.svg?palette=github-light
            assets/snake-dark.svg?palette=github-dark

      - name: Rotate fun fact
        run: |
          python3 - <<'PY'
          import random, re, pathlib

          readme = pathlib.Path("README.md")
          facts = [
              line.strip()
              for line in pathlib.Path(".github/fun-facts.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          text = readme.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(?<=<!--FUN_FACT_START-->).*?(?=<!--FUN_FACT_END-->)", re.DOTALL
          )
          current = pattern.search(text)
          if current is None:
              raise SystemExit("fun fact markers not found in README.md")

          # Never pick the fact already on display, so the daily run always visibly changes.
          choices = [f for f in facts if f"**{f}**" != current.group(0)] or facts
          text = pattern.sub(lambda _: f"**{random.choice(choices)}**", text, count=1)
          readme.write_text(text, encoding="utf-8")
          PY

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg README.md
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh stats SVGs and fun fact"
          git pull --rebase --autostash
          git push
