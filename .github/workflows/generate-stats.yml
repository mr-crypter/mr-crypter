name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch: {}

concurrency:
  group: generate-stats
  cancel-in-progress: true

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate metrics infographic
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          user: mr-crypter
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          output_action: none
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: jupyter notebook
          plugin_languages_colors: github
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: compact

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: mr-crypter
          outputs: |
            assets/snake.svg?palette=github-light
            assets/snake-dark.svg?palette=github-dark

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh GitHub stats SVGs"
          git pull --rebase --autostash
          git push
